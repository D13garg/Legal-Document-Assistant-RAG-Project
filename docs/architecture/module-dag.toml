# The approved v1 module DAG (Phase 1, frozen). Module manifests may declare a SUBSET of these edges.
# Adding a context or an edge requires an ADR (ADR gate) and updating this file.
[modules.identity]
depends_on = []
[modules.access_control]
depends_on = ["identity"]
[modules.audit]
depends_on = []
[modules.documents]
depends_on = ["access_control", "ingestion"]
[modules.ingestion]
depends_on = []
[modules.document_processing]
depends_on = ["documents", "ingestion"]
[modules.chunking]
depends_on = ["document_processing", "documents", "ingestion"]
[modules.retrieval]
depends_on = ["chunking", "documents", "access_control", "ai_gateway", "ingestion"]
[modules.ai_gateway]
depends_on = []
[modules.prompts]
depends_on = []
[modules.citations]
depends_on = ["access_control", "chunking"]
[modules.grounded_generation]
depends_on = ["access_control", "ai_gateway", "prompts", "citations", "documents"]
[modules.conversations]
depends_on = ["citations", "documents"]
[modules.answering]
depends_on = ["retrieval", "grounded_generation", "conversations", "access_control", "ai_gateway", "prompts"]
[modules.evaluation]
depends_on = ["ai_gateway", "prompts"]
